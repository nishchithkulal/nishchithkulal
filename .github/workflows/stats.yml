name: refresh stats

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:
  push:
    paths: [".github/scripts/gen_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render assets/stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution stats" -- assets/stats.svg
          git push
